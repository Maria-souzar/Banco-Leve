<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Extrato Detalhado</title>
  <link rel="stylesheet" type="text/css" href="F_AreaPix_Extrato.css"> <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <script>
    function carregarHistorico(filtro = 'todos') {
      const lista = document.getElementById('listaCompleta');
      lista.innerHTML = "";

      let historicoGeral = JSON.parse(localStorage.getItem('historicoGeral')) || [];

      if (historicoGeral.length === 0) {
        lista.innerHTML = "<li style='border: none; color: #888; justify-content: center;'>Nenhuma movimentação localizada no sistema.</li>";
        return;
      }

      document.querySelectorAll('.btn-filtro').forEach(btn => btn.classList.remove('ativo'));
      document.getElementById(`filtro-${filtro}`).classList.add('ativo');

      historicoGeral.forEach(item => {
        const li = document.createElement('li');
        li.textContent = item;

        const ehSaida = item.includes("PIX de") || item.includes("Transferência") || item.includes("Recarga") || item.includes("Guardou");
        const ehEntrada = item.includes("recebido") || item.includes("Retirou");

        if (ehSaida) li.classList.add('saida');
        if (ehEntrada) li.classList.add('entrada');

        if (filtro === 'todos') {
          lista.appendChild(li);
        } else if (filtro === 'entradas' && ehEntrada) {
          lista.appendChild(li);
        } else if (filtro === 'saidas' && ehSaida) {
          lista.appendChild(li);
        }
      });
    }

    window.onload = function() {
      carregarHistorico('todos');
    };
  </script>
</head>
<body>

  <div class="container-historico">
    <h1>EXTRATO DETALHADO</h1>

    <div class="filtros">
      <button id="filtro-todos" class="btn-filtro ativo" onclick="carregarHistorico('todos')">Todos</button>
      <button id="filtro-entradas" class="btn-filtro" onclick="carregarHistorico('entradas')">Entradas</button>
      <button id="filtro-saidas" class="btn-filtro" onclick="carregarHistorico('saidas')">Saídas</button>
    </div>

    <ul id="listaCompleta"></ul>

  </div>

</body>
</html>

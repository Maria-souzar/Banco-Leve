<html lang="PT-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastrar Chave Pix</title>
  <link rel="stylesheet" href="F_ChavePix.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<script>

async function carregarChaves() {

    const lista =
        document.getElementById("lista_chaves");


    try {

        const resposta =
            await fetch("listar_chaves_pix.php");


        const dados =
            await resposta.json();


        lista.innerHTML = "";


        if (!dados.sucesso) {

            lista.innerHTML =
                "<li>" + dados.mensagem + "</li>";

            return;
        }


        if (dados.chaves.length === 0) {

            lista.innerHTML =
                "<li>Nenhuma chave cadastrada.</li>";

            return;
        }


        dados.chaves.forEach(function(chave) {

            const item =
                document.createElement("li");


            item.innerText =
                chave.tipo_chave +
                ": " +
                chave.chave;


            lista.appendChild(item);

        });


    } catch (erro) {

        console.error(erro);

        lista.innerHTML =
            "<li>Erro ao carregar as chaves.</li>";

    }

}


window.onload =
    carregarChaves;

</script>
<body>
  <section class="pix-section">
    <h2>CADASTRAR CHAVE PIX</h2>
    <input type="text" id="chave_pix" placeholder="DIGITE CPF, E-MAIL OU CELULAR">
    <button onclick="cadastrarChave()">CADASTRAR</button>
  </section>

  <section class="pix-section">
    <h2>CHAVES CADASTRADAS</h2>
    <ul id="lista_chaves"></ul>
  </section>
</body>
</html>

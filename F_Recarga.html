<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Recarga de Celular</title>
  <link rel="stylesheet" type="text/css" href="F_Recarga.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <script>
    // Busca o saldo atual do LocalStorage
    function obterSaldoAtual() {
      let saldo = localStorage.getItem('saldoBancario');
      if (saldo === null) {
        localStorage.setItem('saldoBancario', '1000.00');
        return 1000.00;
      }
      return parseFloat(saldo);
    }

    // Mostra o saldo atualizado na tela
    function exibirSaldoNaTela() {
      const saldo = obterSaldoAtual();
      document.getElementById('saldoExibido').textContent = `Saldo disponível: R$ ${saldo.toFixed(2)}`;
    }

    function recargar() {
      const numero = document.getElementById('numero').value.trim();
      const valor = parseFloat(document.getElementById('valor').value);

      let saldoAtual = obterSaldoAtual();

      if (numero && !isNaN(valor) && valor > 0) {
        
        // VERIFICAÇÃO: O usuário tem dinheiro suficiente?
        if (valor > saldoAtual) {
          document.getElementById('mensagem').textContent = "Saldo insuficiente para realizar a recarga!";
          document.getElementById('mensagem').style.color = "red";
          return; 
        }

        // ATUALIZAÇÃO DO SALDO
        let novoSaldo = saldoAtual - valor;
        localStorage.setItem('saldoBancario', novoSaldo.toFixed(2));

        // Configuração de horários para o extrato geral
        const agora = new Date();
        const horaFormatada = agora.toLocaleTimeString("pt-BR", { hour: '2-digit', minute: '2-digit' });

        // ================================================================
        // GRAVAÇÃO NO HISTÓRICO GERAL (Para a Tela Inicial e Extrato)
        // ================================================================
        let historicoGeral = JSON.parse(localStorage.getItem('historicoGeral')) || [];
        
        // Criamos a frase com "Recarga" para que a tela de extrato saiba que é uma Saída
        const novaTransacao = `Recarga de celular de R$ ${valor.toFixed(2)} às ${horaFormatada}`;
        historicoGeral.unshift(novaTransacao);
        
        localStorage.setItem('historicoGeral', JSON.stringify(historicoGeral));
        // ================================================================

        document.getElementById('mensagem').textContent = "Recarga realizada com sucesso!";
        document.getElementById('mensagem').style.color = "green";

        exibirSaldoNaTela(); // Atualiza o saldo na interface
        atualizarHistoricoNaTela(); // Atualiza a lista da página
      } else {
        document.getElementById('mensagem').textContent = "Preencha todos os campos!";
        document.getElementById('mensagem').style.color = "red";
      }
    }

    function resetar() {
      document.getElementById('mensagem').textContent = "";
      document.getElementById('numero').value = "";
      document.getElementById('valor').value = "";
    }

    // Carrega o histórico geral e mostra nesta página apenas as recargas
    function atualizarHistoricoNaTela() {
      const lista = document.getElementById('listaHistorico');
      lista.innerHTML = "";
      
      let historicoGeral = JSON.parse(localStorage.getItem('historicoGeral')) || [];
      
      // Filtra para exibir aqui embaixo apenas o que for referente a Recarga
      const apenasRecargas = historicoGeral.filter(item => item.includes("Recarga"));

      if (apenasRecargas.length === 0) {
        lista.innerHTML = "<li style='list-style:none; color:#888;'>Nenhuma recarga realizada recentemente.</li>";
        return;
      }

      apenasRecargas.forEach(item => {
        const li = document.createElement('li');
        li.textContent = item;
        lista.appendChild(li);
      });
    }

    // Inicializa a página carregando o saldo e o histórico salvos
    window.onload = function() {
      exibirSaldoNaTela();
      atualizarHistoricoNaTela();
    };
  </script>
</head>
<body>
  <div class="container">
    <h1>RECARGA DE CELULAR</h1>
    
    <div id="saldoExibido" style="font-weight: bold; margin-bottom: 15px; font-size: 1.1em;"></div>

    <input type="text" id="numero" placeholder="Número do celular">
    <select id="valor">
      <option value="">SELECIONE O VALOR</option>
      <option value="10">R$ 10</option>
      <option value="20">R$ 20</option>
      <option value="30">R$ 30</option>
      <option value="50">R$ 50</option>
    </select>
    <br>
    <button onclick="recargar()">CONFIRMAR</button>
    <button onclick="resetar()">RESETAR</button>

    <div class="mensagem" id="mensagem"></div>

    <div class="historico">
      <h2>HISTÓRICO DE RECARGAS</h2>
      <ul id="listaHistorico"></ul>
    </div>
  </div>
</body>
</html>

<html lang="PT-BR">

    <head>

        <meta charset="UTF-8">

        <title>CONTA</title>

        <link rel="stylesheet" type="text/css" href="F_Conta_Corpo.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">

        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

        <script>

          let nome = "Rafaela"; 

          // --- MODIFICADO: Puxa o saldo real ou define o inicial se o app abrir por aqui ---
          function obterSaldoAtual() {
            let saldoSalvo = localStorage.getItem('saldoBancario');
            if (saldoSalvo === null) {
              localStorage.setItem('saldoBancario', '1000.00'); // Padrão adotado de R$ 1000,00
              return 1000.00;
            }
            return parseFloat(saldoSalvo);
          }

          function mostrarSaldo() {
            // Usa a função dinâmica em vez da variável estática antiga
            const saldoReal = obterSaldoAtual();
            document.getElementById("saldo_valor").innerText = "R$ " + saldoReal.toFixed(2);
          }

          function mostrarNome() {
            document.getElementById("nome_usuario").innerText = "OLÁ, " + nome;
          }

          // --- NOVA FUNÇÃO: Carrega as movimentações que vieram das outras páginas ---
          function carregarExtratoGeral() {
            const lista = document.getElementById('listaExtratoGeral');
            lista.innerHTML = "";

            let historicoGeral = JSON.parse(localStorage.getItem('historicoGeral')) || [];

            if (historicoGeral.length === 0) {
              lista.innerHTML = "<li style='list-style: none; color: #777;'>Nenhuma movimentação realizada ainda.</li>";
              return;
            }

            historicoGeral.forEach(item => {
              const li = document.createElement('li');
              li.textContent = item;
              li.style.marginBottom = "8px"; // Organização visual básica
              lista.appendChild(li);
            });
          }

          window.onload = function () {
            mostrarSaldo();
            mostrarNome();
            carregarExtratoGeral(); // Roda o extrato ao iniciar
          };

        </script>

    </head>

        <body>

          <header>

            <div class="header-info">

              <h3 id="nome_usuario"></h3>

              <h4 id="agencia_conta">AGÊNCIA: 0002 | CONTA: 12345-6</h4>

            </div>

          </header>



          <section class="saldo">

            <h3>SALDO DISPONÍVEL</h3>

            <p id="saldo_valor"></p>

          </section>


          <br><br>

          <section>

            <div class="container">

                <button class="pix-button" onclick="window.location.href='F_AreaPix_Corpo.html'">

                  <img src="Imagem_Icon_Pix.png" alt="Ícone" class="icon">

                  <h3>ÁREA PIX</h3>

                  <p>Enviar dinheiro para outra pessoa ou conta, de forma rápida e fácil</p>

                </button>



                <button class="pix-button" onclick="window.location.href='F_Transferir.html'">

                  <img src="Imagem_Icon_Trocar.png" alt="Ícone" class="icon">

                  <h3>TRANSFERÊNCIA</h3>

                  <p>Conecte seu banco com o LEVE e gerencie suas contas de um só lugar</p>

                </button>



                <button class="pix-button" onclick="window.location.href='F_AreaPix_Pagar.html'">

                  <img src="Imagem_Icon_Moeda.png" alt="Ícone" class="icon">

                  <h3>PAGAR CONTA</h3>

                  <p>Usar o dinheiro da conta para pagar contas, boletos ou compras</p>

                </button>



                <button class="pix-button" onclick="window.location.href='F_PegarEmprestado.html'">

                  <img src="Imagem_Icon_Receber.png" alt="Ícone" class="icon">

                  <h3>PEGAR EMPRESTADO</h3>

                  <p>Solicitar um valor para usar agora e pagar depois</p>

                </button>



                <button class="pix-button" onclick="window.location.href='F_Recarga.html'">

                  <img src="Imagem_Icon_Celular.png" alt="Ícone" class="icon">

                  <h3>RECARREGAR CELULAR</h3>

                  <p>Colocar créditos no celular direto pelo banco de forma prática e segura</p>

                </button>



                <button class="pix-button" onclick="window.location.href='F_Cofrinho_Guardar.html'">

                  <img src="Imagem_Icon_Cofrinho.png" alt="Ícone" class="icon">

                  <h3>COFRINHO</h3>

                  <p>Separar um dinheiro para guardar, como uma reserva ou objetivo</p>

                </button>

            </div>

          </section>

          
          <section class="extrato-container" style="background: #f9f9f9; padding: 15px; margin: 20px auto; max-width: 90%; border-radius: 8px; border: 1px solid #ddd;">
            <h3 style="margin-top: 0; color: #333;">EXTRATO DA CONTA</h3>
            <ul id="listaExtratoGeral" style="padding-left: 20px; font-size: 0.95em;">
              </ul>
          </section>

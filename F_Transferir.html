<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Transferência de Dinheiro</title>

    <link
        rel="stylesheet"
        type="text/css"
        href="F_Transferir.css"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet"
    >

</head>


<body>

    <div class="container">

        <h1>TRANSFERÊNCIA BANCÁRIA</h1>


        <!-- SALDO REAL DA CONTA -->
        <div class="conta">

            CONTA ORIGEM: R$

            <span id="origem">
                CARREGANDO...
            </span>

        </div>


        <!-- CONTA QUE RECEBERÁ A TRANSFERÊNCIA -->
        <div class="conta">

            CONTA DESTINO:

            <span id="destino">
                CONTA DESTINO
            </span>

        </div>


        <input
            type="number"
            id="valor"
            placeholder="VALOR DA TRANSFERÊNCIA"
            min="0.01"
            step="0.01"
        >


        <br>


        <button onclick="transferir()">
            TRANSFERIR
        </button>


        <button onclick="resetar()">
            CANCELAR
        </button>


        <div
            class="mensagem"
            id="mensagem">
        </div>


        <div class="historico">

            <h2>HISTÓRICO DE TRANSFERÊNCIAS</h2>

            <ul id="listaHistorico"></ul>

        </div>

    </div>


<script>


// =====================================================
// CARREGAR SALDO DA CONTA
// =====================================================

async function carregarSaldo() {

    const origem =
        document.getElementById("origem");


    try {

        const resposta =
            await fetch("saldo.php");


        const dados =
            await resposta.json();


        if (dados.sucesso) {

            origem.innerText =
                Number(dados.saldo)
                .toFixed(2);

        } else {

            origem.innerText =
                "ERRO";

        }


    } catch (erro) {

        console.error(erro);

        origem.innerText =
            "ERRO";

    }

}


// =====================================================
// REALIZAR TRANSFERÊNCIA
// =====================================================

async function transferir() {

    const valor =
        Number(
            document.getElementById("valor").value
        );


    const mensagem =
        document.getElementById("mensagem");


    // ---------------------------------------------
    // VALIDAR VALOR
    // ---------------------------------------------

    if (!Number.isFinite(valor) || valor <= 0) {

        mensagem.innerText =
            "Digite um valor válido.";

        return;

    }


    try {

        const resposta =
            await fetch(
                "transferencia.php",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        valor: valor

                    })

                }
            );


        const dados =
            await resposta.json();


        // ---------------------------------------------
        // TRANSFERÊNCIA REALIZADA
        // ---------------------------------------------

        if (dados.sucesso) {

            mensagem.innerText =
                dados.mensagem;


            // Atualiza o saldo mostrado
            // na própria tela

            document.getElementById(
                "origem"
            ).innerText =
                Number(dados.saldo_atual)
                .toFixed(2);


            document.getElementById(
                "valor"
            ).value = "";


            // Adiciona ao histórico

            adicionarHistorico(
                valor
            );


        } else {

            mensagem.innerText =
                dados.mensagem;

        }


    } catch (erro) {

        console.error(erro);

        mensagem.innerText =
            "Erro ao comunicar com o servidor.";

    }

}


// =====================================================
// HISTÓRICO VISUAL
// =====================================================

function adicionarHistorico(valor) {

    const lista =
        document.getElementById(
            "listaHistorico"
        );


    const item =
        document.createElement("li");


    item.innerText =
        "Transferência: R$ " +
        Number(valor).toFixed(2);


    lista.prepend(item);

}


// =====================================================
// CANCELAR
// =====================================================

function resetar() {

    document.getElementById(
        "valor"
    ).value = "";


    document.getElementById(
        "mensagem"
    ).innerText = "";

}


// =====================================================
// AO ABRIR A PÁGINA
// =====================================================

window.onload =
    carregarSaldo;


</script>


</body>

</html>

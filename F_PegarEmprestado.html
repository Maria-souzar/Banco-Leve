<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pegar Empréstimo</title>
  <link rel="stylesheet" type="text/css" href="F_PegarEmprestado.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <script>
    let historico = [];

    function emprestar() {
      const valor = parseFloat(document.getElementById('valor').value);
      const prazo = document.getElementById('prazo').value;

      if (!isNaN(valor) && valor > 0 && prazo) {
        // juros simples: 2% ao mês
        const juros = 0.02;
        const total = valor * (1 + juros * prazo);

        const registro = `Empréstimo de R$ ${valor.toFixed(2)} em ${prazo} meses. Total a pagar: R$ ${total.toFixed(2)}`;
        historico.push(registro);

        document.getElementById('mensagem').textContent = "Empréstimo aprovado!";
        atualizarHistorico();
      } else {
        document.getElementById('mensagem').textContent = "Preencha todos os campos corretamente!";
      }
    }

    function resetar() {
      historico = [];
      document.getElementById('mensagem').textContent = "";
      document.getElementById('valor').value = "";
      document.getElementById('prazo').value = "";
      atualizarHistorico();
    }

    function atualizarHistorico() {
      const lista = document.getElementById('listaHistorico');
      lista.innerHTML = "";
      historico.forEach(item => {
        const li = document.createElement('li');
        li.textContent = item;
        lista.appendChild(li);
      });
    }
  </script>
</head>
<body>
  <div class="container">
    <h1>PEGAR EMPRÉSTIMO</h1>
    <input type="number" id="valor" placeholder="VALOR DO EMPRÉSTIMO">
    <select id="prazo">
      <option value="">SELECIONE O PRAZO</option>
      <option value="6">6 MESES</option>
      <option value="12">12 MESES</option>
      <option value="24">24 MESES</option>
    </select>
    <br>
    <button onclick="emprestar()">CONFIRMAR</button>
    <button onclick="resetar()">CANCELAR</button>

    <div class="mensagem" id="mensagem"></div>

    <div class="historico">
      <h2>HISTÓRICO DE EMPRÉSTIMOS</h2>
      <ul id="listaHistorico"></ul>
    </div>
  </div>
</body>
</html>

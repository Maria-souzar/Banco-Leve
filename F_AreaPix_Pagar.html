<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>PAGAR COM PIX</title>
  <link rel="stylesheet" href="F_AreaPix_Pagar.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <script>
    // Busco o saldo atual do LocalStorage
    function obterSaldoAtual() {
      let saldo = localStorage.getItem('saldoBancario');
      
      // Se não existir saldo no localStorage ainda, define um saldo inicial de 1000 reais
      if (saldo === null) {
        localStorage.setItem('saldoBancario', '1000.00');
        return 1000.00;
      }
      
      return parseFloat(saldo);
    }

    // Mostra o saldo atualizado na tela
    function exibirSaldoNaTela() {
      const saldo = obterSaldoAtual();
      document.getElementById('saldoExibido').textContent = `Saldo disponível: R$ ${saldo.toFixed(2)}`;
    }

    function pagar() {
      const chave = document.getElementById('chave').value.trim();
      const valor = parseFloat(document.getElementById('valor').value);
  
      // Busca o saldo atual antes de fazer a operação
      let saldoAtual = obterSaldoAtual();

      if (chave && !isNaN(valor) && valor > 0) {
       
        // Verificar se tem saldo suficiente 
        if (valor > saldoAtual) {
          document.getElementById('mensagem').textContent = "Saldo insuficiente para realizar este PIX!";
          document.getElementById('mensagem').style.color = "red";
          return; 
        }

        // Atualiza o saldo
        let novoSaldo = saldoAtual - valor;
        localStorage.setItem('saldoBancario', novoSaldo.toFixed(2)); // Salva no LocalStorage

        // Configuração de datas e horários
        const dataCompleta = new Date().toLocaleString("pt-BR");
        const agora = new Date();
        const horaFormatada = agora.toLocaleTimeString("pt-BR", { hour: '2-digit', minute: '2-digit' });

        // ================================================================
        // GRAVAÇÃO NO HISTÓRICO GERAL (Para aparecer na Tela Inicial e Extrato)
        // ================================================================
        let historicoGeral = JSON.parse(localStorage.getItem('historicoGeral')) || [];
        
        // Criamos o texto padrão que as outras telas vão ler e identificar como Saída
        const novaTransacao = `PIX de R$ ${valor.toFixed(2)} para chave ${chave} às ${horaFormatada}`;
        historicoGeral.unshift(novaTransacao);
        
        localStorage.setItem('historicoGeral', JSON.stringify(historicoGeral));
        // ================================================================

        document.getElementById('mensagem').textContent = "Pagamento realizado com sucesso!";
        document.getElementById('mensagem').style.color = "green";
       
        exibirSaldoNaTela(); // Atualiza o saldo na tela
        atualizarHistoricoNaTela(); // Atualiza a lista da página
      } else {
        document.getElementById('mensagem').textContent = "Preencha todos os campos corretamente!";
        document.getElementById('mensagem').style.color = "red";
      }
    }

    function resetar() {
      document.getElementById('mensagem').textContent = "";
      document.getElementById('chave').value = "";
      document.getElementById('valor').value = "";
    }

    // Carrega o histórico geral e mostra nesta página apenas as transações que foram desse tipo "PIX"
    function atualizarHistoricoNaTela() {
      const lista = document.getElementById('listaHistorico');
      lista.innerHTML = "";
      
      let historicoGeral = JSON.parse(localStorage.getItem('historicoGeral')) || [];
      
      // Filtra para exibir aqui embaixo apenas o que for referente a PIX
      const apenasPix = historicoGeral.filter(item => item.includes("PIX de"));

      if (apenasPix.length === 0) {
        lista.innerHTML = "<li style='list-style:none; color:#888;'>Nenhum PIX realizado recentemente.</li>";
        return;
      }

      apenasPix.forEach(item => {
        const li = document.createElement('li');
        li.textContent = item;
        lista.appendChild(li);
      });
    }

    // Executa as funções essenciais assim que a página abre
    window.onload = function() {
      exibirSaldoNaTela();
      atualizarHistoricoNaTela();
    };
  </script>
</head>
<body>
  <div class="container">
    <h1>PAGAMENTO VIA PIX</h1>
   
    <div id="saldoExibido" style="font-weight: bold; margin-bottom: 15px; font-size: 1.1em;"></div>

    <input type="text" id="chave" placeholder="DIGITE A CHAVE PIX">
    <input type="number" id="valor" placeholder="VALOR DO PAGAMENTO">
    <br>
    <button onclick="pagar()">PAGAR</button>
    <button onclick="resetar()">CANCELAR</button>

    <div class="mensagem" id="mensagem"></div>

    <div class="historico">
      <h2>HISTÓRICO DE PAGAMENTOS</h2>
      <ul id="listaHistorico"></ul>
    </div>
  </div>
</body>
</html>
